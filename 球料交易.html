<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8体育特供</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei", "PingFang SC", sans-serif;}
        :root {--primary:#2563eb; --success:#07c160; --warning:#f97316; --danger:#dc2626; --gray:#6b7280; --bg:#f8fafc;}
        body {background:var(--bg); min-height:100vh;}
        .header {background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.06); padding:0 20px; position:sticky; top:0; z-index:99;}
        .header-inner {max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; height:64px; flex-wrap:wrap; gap:10px;}
        .logo {font-size:20px; font-weight:700; color:var(--primary); display:flex; align-items:center; gap:8px;}
        .nav {display:flex; gap:8px; flex-wrap:wrap;}
        .nav a {text-decoration:none; color:#4b5563; padding:10px 18px; border-radius:8px; font-size:15px; transition:all .2s;}
        .nav a:hover, .nav a.active {background:var(--primary); color:#fff;}
        .kefu-btn {background:var(--success); color:#fff; padding:8px 16px; border-radius:20px; font-size:14px; text-decoration:none; font-weight:600; border:none; cursor:pointer; white-space:nowrap;}
        .login-area {display:flex; gap:10px; align-items:center;}
        .user-info {font-size:14px; color:#374151;}
        .logout-btn {background:#f3f4f6; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; margin-left:8px;}
        .register-bar {background:linear-gradient(135deg,#2563eb,#4f46e5); color:#fff; padding:16px 24px; text-align:center; margin-bottom:24px; border-radius:12px;}
        .register-title {font-size:18px; font-weight:600; margin-bottom:6px;}
        .register-desc {font-size:14px; opacity:.9; margin-bottom:12px;}
        .register-link {background:#fff; color:#2563eb; padding:10px 24px; border-radius:8px; text-decoration:none; font-weight:700; display:inline-block; transition:all .2s;}
        .register-link:hover {transform:scale(1.05);}
        /* 登录弹窗 */
        .login-modal {position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:9999;}
        .login-modal.hidden {display:none;}
        .login-box {background:#fff; border-radius:16px; padding:32px; max-width:420px; width:90%; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.2);}
        .login-title {font-size:22px; font-weight:700; margin-bottom:12px; color:#1f2937;}
        .login-desc {color:#6b7280; margin-bottom:24px; line-height:1.6; font-size:14px;}
        .login-input {width:100%; padding:14px 18px; border:2px solid #e5e7eb; border-radius:10px; font-size:16px; margin-bottom:12px;}
        .login-input:focus {outline:none; border-color:var(--primary);}
        .login-btn {width:100%; padding:14px; background:var(--primary); color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; transition:all .2s; margin-top:8px;}
        .login-btn:hover {background:#1d4ed8;}
        .login-error {color:var(--danger); margin-top:12px; font-size:14px; display:none;}
        .login-error.show {display:block;}
        .login-tip {margin-top:16px; font-size:13px; color:#6b7280;}
        .login-tip a {color:var(--primary); text-decoration:none;}
        .admin-panel {background:#fff; border-radius:12px; padding:20px; margin-bottom:24px; box-shadow:0 2px 8px rgba(0,0,0,0.05); display:none;}
        .admin-panel.show {display:block;}
        .admin-title {font-size:18px; font-weight:600; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}
        .admin-toggle {font-size:13px; background:#e5e7eb; padding:6px 12px; border-radius:16px; cursor:pointer;}
        .form-row {display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
        .form-input {flex:1; min-width:180px; padding:10px 14px; border:1px solid #e5e7eb; border-radius:8px; font-size:14px;}
        .form-btn {padding:10px 20px; border:none; border-radius:8px; cursor:pointer; font-weight:600;}
        .btn-primary {background:var(--primary); color:#fff;}
        .btn-success {background:var(--success); color:#fff;}
        .goods-grid {display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:24px; opacity:0.2; pointer-events:none; transition:all .5s;}
        .goods-grid.unlocked {opacity:1; pointer-events:auto;}
        .goods-card {background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05); transition:all .3s; position:relative;}
        .goods-card:hover {transform:translateY(-4px); box-shadow:0 8px 20px rgba(0,0,0,0.1);}
        .goods-img {width:100%; height:200px; background:linear-gradient(135deg,#e0e7ff,#c7d2fe); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;}
        .goods-img img {width:100%; height:100%; object-fit:cover;}
        .goods-body {padding:18px;}
        .goods-name {font-size:17px; font-weight:600; margin-bottom:8px; line-height:1.4;}
        .goods-desc {font-size:13px; color:var(--gray); margin-bottom:14px; min-height:40px; line-height:1.5;}
        .goods-price {font-size:24px; font-weight:700; color:var(--danger); margin-bottom:14px;}
        .goods-admin-bar {position:absolute; top:8px; right:8px; display:none; gap:6px;}
        .goods-admin-bar.show {display:flex;}
        .goods-admin-btn {padding:4px 8px; font-size:12px; border:none; border-radius:4px; cursor:pointer; background:rgba(0,0,0,.5); color:#fff;}
        .btn {padding:10px 20px; border:none; border-radius:8px; cursor:pointer; font-weight:600;}
        .btn-sm {padding:6px 12px; font-size:13px;}
        .btn-block {width:100%;}
        .empty {text-align:center; padding:60px 20px; color:#9ca3af;}
        .search-bar {display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap;}
        .search-input {flex:1; min-width:250px; padding:14px 20px; border:1px solid #e5e7eb; border-radius:10px; font-size:15px;}
        .kefu-float {position:fixed; bottom:30px; right:30px; z-index:999;}
        .kefu-float-btn {width:60px; height:60px; background:var(--success); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; cursor:pointer; box-shadow:0 4px 15px rgba(7,193,96,.4); transition:all .3s;}
        .kefu-float-btn:hover {transform:scale(1.1);}
        .kefu-float-box {position:absolute; bottom:80px; right:0; width:320px; background:#fff; border-radius:12px; box-shadow:0 5px 30px rgba(0,0,0,.15); display:none; overflow:hidden;}
        .kefu-float-box.show {display:block;}
        .kefu-float-head {background:var(--success); color:#fff; padding:15px; font-weight:600;}
        .kefu-float-body {padding:20px; text-align:center;}
        .kefu-float-avatar {width:60px; height:60px; background:#e6f7ee; border-radius:50%; margin:0 auto 15px; display:flex; align-items:center; justify-content:center; font-size:30px;}
        .kefu-float-name {font-weight:600; margin-bottom:5px;}
        .kefu-float-desc {color:#6b7280; font-size:13px; margin-bottom:20px;}
        .kefu-float-link {display:block; background:var(--success); color:#fff; text-decoration:none; padding:12px; border-radius:8px; margin-bottom:10px; font-weight:600; border:none; cursor:pointer; font-size:16px; width:100%;}
        .kefu-float-link.qq {background:#12b7f5;}
        @media (max-width:768px) {
            .header-inner {flex-direction:column; gap:12px; padding:12px 0; height:auto;}
            .goods-grid {grid-template-columns:repeat(2,1fr);}
        }
    </style>
</head>
<body>

<!-- 登录弹窗 -->
<div class="login-modal" id="loginModal">
    <div class="login-box">
        <div class="login-title">🔐 账号登录</div>
        <div class="login-desc">请使用从专属链接注册的账号登录<br>未注册请先点击下方注册</div>
        <input type="text" class="login-input" id="username" placeholder="输入账号" autocomplete="off">
        <input type="password" class="login-input" id="password" placeholder="输入密码" autocomplete="off">
        <button class="login-btn" onclick="checkLogin()">立即登录</button>
        <div class="login-error" id="loginError">❌ 账号或密码错误<br>请从专属链接注册后再登录</div>
        <div class="login-tip">还没有账号？<a href="https://v8166.vip" target="_blank">👉 立即注册</a></div>
    </div>
</div>

<header class="header">
    <div class="header-inner">
        <div class="logo">📘 V8体育特供</div>
        <nav class="nav">
            <a href="#" class="active" data-page="home">商品广场</a>
        </nav>
        <div class="login-area" id="loginArea">
            <span class="user-info" id="userDisplay" style="display:none;">👤 <span id="currentUser"></span></span>
            <button class="logout-btn" id="logoutBtn" style="display:none;" onclick="logout()">退出</button>
            <button class="kefu-btn" onclick="showKefu()">💬 客服</button>
        </div>
    </div>
</header>

<main class="container">
    <section id="home" class="page active">
        <!-- 专属注册入口 -->
        <div class="register-bar">
            <div class="register-title">🎁 专属通道 - 新用户注册享福利</div>
            <div class="register-desc">仅限从本页面注册的用户享受专属福利</div>
            <a href="https://v8166.vip" target="_blank" class="register-link">👉 立即注册</a>
        </div>

        <!-- 管理员入口 -->
        <div style="text-align:center; margin-bottom:16px;">
            <button class="btn btn-sm" style="background:#e5e7eb; color:#374151;" onclick="toggleAdminPanel()">🔐 管理员入口</button>
        </div>

        <!-- 管理员面板 -->
        <div class="admin-panel" id="admin-panel">
            <div class="admin-title">
                🔐 管理员上架商品
                <span class="admin-toggle" onclick="toggleAdmin()">收起</span>
            </div>
            <div class="form-row">
                <input type="text" class="form-input" id="new-name" placeholder="商品名称">
                <input type="number" class="form-input" id="new-price" placeholder="价格" step="0.01">
            </div>
            <div class="form-row">
                <input type="text" class="form-input" id="new-desc" placeholder="商品描述">
                <input type="text" class="form-input" id="new-img" placeholder="图片直链">
                <button class="form-btn btn-primary" onclick="adminAddGoods()">✅ 上架</button>
            </div>
        </div>
        
        <div class="search-bar">
            <input type="text" class="search-input" id="search-input" placeholder="搜索商品名称...">
            <button class="btn btn-primary" id="search-btn">搜索</button>
        </div>
        <div class="goods-grid" id="goods-grid"></div>
    </section>
</main>

<!-- 悬浮客服 -->
<div class="kefu-float">
    <div class="kefu-float-btn" onclick="document.querySelector('.kefu-float-box').classList.toggle('show')">💬</div>
    <div class="kefu-float-box">
        <div class="kefu-float-head">在线客服</div>
        <div class="kefu-float-body">
            <div class="kefu-float-avatar">👨‍💼</div>
            <div class="kefu-float-name">V8官方客服</div>
            <div class="kefu-float-desc">工作时间：09:00-24:00<br>竭诚为您服务</div>
            <button class="kefu-float-link" onclick="alert('请添加微信：\nAA9767A')">💚 微信联系</button>
            <button class="kefu-float-link qq" onclick="alert('请添加QQ：\n142749228')">🐧 QQ联系</button>
        </div>
    </div>
</div>

<script>
// ========== 配置区 ==========
const ADMIN_PASSWORD = '123456';        // 管理员密码
const REGISTER_URL = 'https://v8166.vip'; // 注册链接

// ✅ 已注册的有效账号列表（添加在这里）
const VALID_USERS = {
    // '账号名': '密码',
    'asd888': 'zxc334586',
    // 继续添加：'张三': '123456',
};

// 商品库
let goodsList = [
    {
        id: 1,
        name: '雷速拉坦伊布拉莫维奇',
        price: 199,
        desc: 'v8体育官方特别提供，如想全免享用请联系客服',
        img: 'https://i.postimg.cc/tJWSmNyD/yi-bu.jpg',
    },
    {
        id: 2,
        name: '雷速傻哥专业连红搬运',
        price: 150,
        desc: 'v8体育官方特别提供，如想全免享用请联系客服',
        img: 'https://i.postimg.cc/xdXP433G/sha-ge.jpg',
    },
    {
        id: 3,
        name: '雷速弘扬奉献精神的阿火',
        price: 85,
        desc: 'v8体育官方特别提供，如想全免享用请联系客服',
        img: '', // 填阿火的链接
    }
];

let isAdmin = false;
let currentUser = null;

// 检查是否已登录
function checkLoggedIn() {
    const saved = localStorage.getItem('v8_user');
    if (saved) {
        const userData = JSON.parse(saved);
        if (VALID_USERS[userData.username] === userData.password) {
            currentUser = userData.username;
            showLoggedIn();
            return true;
        }
    }
    return false;
}

// 登录验证
function checkLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    
    if (VALID_USERS[username] && VALID_USERS[username] === password) {
        currentUser = username;
        localStorage.setItem('v8_user', JSON.stringify({username, password}));
        showLoggedIn();
    } else {
        document.getElementById('loginError').classList.add('show');
    }
}

// 显示已登录状态
function showLoggedIn() {
    document.getElementById('loginModal').classList.add('hidden');
    document.getElementById('goods-grid').classList.add('unlocked');
    document.getElementById('currentUser').textContent = currentUser;
    document.getElementById('userDisplay').style.display = 'inline';
    document.getElementById('logoutBtn').style.display = 'inline';
    renderGoods();
}

// 退出登录
function logout() {
    localStorage.removeItem('v8_user');
    currentUser = null;
    document.getElementById('goods-grid').classList.remove('unlocked');
    document.getElementById('userDisplay').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'none';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('loginError').classList.remove('show');
    document.getElementById('loginModal').classList.remove('hidden');
}

function showKefu() {
    alert('微信：AA9767A\nQQ群：142749228\n注册/登录 请联系客服');
}

function toggleAdminPanel() {
    if (isAdmin) {
        document.getElementById('admin-panel').classList.toggle('show');
        return;
    }
    const pwd = prompt('请输入管理员密码：');
    if (pwd === ADMIN_PASSWORD) {
        isAdmin = true;
        document.getElementById('admin-panel').classList.add('show');
        alert('✅ 管理员模式已开启');
    } else if (pwd) {
        alert('❌ 密码错误');
    }
}
function toggleAdmin() {
    document.getElementById('admin-panel').classList.remove('show');
}

function adminAddGoods() {
    if (!isAdmin) return alert('请先验证管理员密码');
    const name = document.getElementById('new-name').value.trim();
    const price = parseFloat(document.getElementById('new-price').value);
    const desc = document.getElementById('new-desc').value.trim() || 'v8体育官方特供';
    const img = document.getElementById('new-img').value.trim();
    
    if (!name || !price || price <= 0) {
        return alert('请填写名称和价格');
    }
    
    const newId = goodsList.length ? Math.max(...goodsList.map(g => g.id)) + 1 : 1;
    goodsList.push({id: newId, name, price, desc, img});
    
    document.getElementById('new-name').value = '';
    document.getElementById('new-price').value = '';
    document.getElementById('new-desc').value = '';
    document.getElementById('new-img').value = '';
    
    alert('✅ 商品上架成功！');
    renderGoods();
}

function adminDeleteGoods(id) {
    if (!isAdmin) return;
    if (!confirm('确定删除此商品？')) return;
    goodsList = goodsList.filter(g => g.id !== id);
    renderGoods();
}

function renderGoods(list = goodsList) {
    const grid = document.getElementById('goods-grid');
    if (!list.length) {
        grid.innerHTML = `<div class="empty">暂无商品，敬请期待</div>`;
        return;
    }
    grid.innerHTML = list.map(item => `
        <div class="goods-card">
            ${isAdmin ? `
                <div class="goods-admin-bar show">
                    <button class="goods-admin-btn" onclick="adminDeleteGoods(${item.id})">删除</button>
                </div>
            ` : ''}
            <div class="goods-img">
                ${item.img 
                    ? `<img src="${item.img}" alt="${item.name}" onerror="this.parentElement.innerHTML='📦'">`
                    : '📦'
                }
            </div>
            <div class="goods-body">
                <div class="goods-name">${item.name}</div>
                <div class="goods-desc">${item.desc}</div>
                <div class="goods-price">¥${item.price.toFixed(2)}</div>
                <button class="btn btn-success btn-sm btn-block" disabled>✅ 查看详情</button>
            </div>
        </div>
    `).join('');
}

function searchGoods() {
    const kw = document.getElementById('search-input').value.trim().toLowerCase();
    if (!kw) return renderGoods();
    renderGoods(goodsList.filter(g => g.name.toLowerCase().includes(kw)));
}

document.addEventListener('DOMContentLoaded', function () {
    if (!checkLoggedIn()) {
        document.getElementById('loginModal').classList.remove('hidden');
    }
    
    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') checkLogin();
    });
    document.getElementById('search-btn').addEventListener('click', searchGoods);
    document.getElementById('search-input').addEventListener('keydown', e => e.key === 'Enter' && searchGoods());
});
</script>

</body>
</html>
