<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8体育特供，球料分享</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei", "PingFang SC", sans-serif;}
        :root {--primary:#2563eb; --success:#16a34a; --warning:#f97316; --danger:#dc2626; --gray:#6b7280; --bg:#f8fafc;}
        body {background:var(--bg); min-height:100vh;}
        .header {background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.06); padding:0 20px; position:sticky; top:0; z-index:99;}
        .header-inner {max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; height:64px; flex-wrap:wrap; gap:10px;}
        .logo {font-size:22px; font-weight:700; color:var(--primary);}
        .nav {display:flex; gap:8px; flex-wrap:wrap;}
        .nav a {text-decoration:none; color:#4b5563; padding:10px 18px; border-radius:8px; font-size:15px; transition:all .2s;}
        .nav a:hover, .nav a.active {background:var(--primary); color:#fff;}
        .balance-box {background:#fef3c7; color:#d97706; padding:8px 16px; border-radius:20px; font-size:14px; white-space:nowrap;}
        .balance-box strong {font-size:16px;}
        .container {max-width:1200px; margin:0 auto; padding:24px 20px;}
        .page {display:none;}
        .page.active {display:block;}
        .search-bar {display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap;}
        .search-input {flex:1; min-width:250px; padding:14px 20px; border:1px solid #e5e7eb; border-radius:10px; font-size:15px;}
        .btn {padding:12px 24px; border:none; border-radius:10px; font-size:15px; cursor:pointer; white-space:nowrap;}
        .btn-primary {background:var(--primary); color:#fff;}
        .btn-success {background:var(--success); color:#fff;}
        .btn-sm {padding:8px 14px; font-size:14px;}
        .btn-block {width:100%;}
        .goods-grid {display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:20px;}
        .goods-card {background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05); transition:all .3s;}
        .goods-card:hover {transform:translateY(-4px); box-shadow:0 8px 20px rgba(0,0,0,0.1);}
        .goods-img {width:100%; height:200px; background:linear-gradient(135deg,#e0e7ff,#c7d2fe); display:flex; align-items:center; justify-content:center; font-size:48px; color:var(--primary); overflow:hidden;}
        .goods-img img {width:100%; height:100%; object-fit:cover;}
        .goods-body {padding:16px;}
        .goods-name {font-size:16px; font-weight:600; margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
        .goods-desc {font-size:13px; color:var(--gray); margin-bottom:12px; height:36px; overflow:hidden; line-height:1.5;}
        .goods-price {font-size:22px; font-weight:700; color:var(--danger);}
        .goods-meta {display:flex; justify-content:space-between; margin-top:12px; font-size:12px; color:#9ca3af;}
        .form-card {background:#fff; border-radius:12px; padding:30px; max-width:560px; margin:0 auto; box-shadow:0 2px 12px rgba(0,0,0,0.06);}
        .form-title {font-size:20px; font-weight:600; text-align:center; margin-bottom:28px;}
        .form-group {margin-bottom:20px;}
        .form-label {display:block; margin-bottom:8px; font-size:14px; font-weight:500;}
        .form-input, .form-textarea, .form-select {width:100%; padding:12px 16px; border:1px solid #e5e7eb; border-radius:8px; font-size:15px;}
        .form-textarea {resize:vertical; min-height:100px;}
        .wallet-card {background:linear-gradient(135deg,#2563eb,#4f46e5); color:#fff; border-radius:16px; padding:32px; text-align:center; margin-bottom:24px;}
        .wallet-amount {font-size:42px; font-weight:700; margin:12px 0;}
        .wallet-btns {display:flex; gap:12px; margin-top:24px; flex-wrap:wrap; justify-content:center;}
        .wallet-btns .btn {background:rgba(255,255,255,.2); color:#fff; border:none;}
        .empty {text-align:center; padding:60px 20px; color:#9ca3af;}
        @media (max-width:768px) {
            .header-inner {flex-direction:column; gap:12px; padding:12px 0; height:auto;}
            .goods-grid {grid-template-columns:repeat(2,1fr);}
            .form-card {padding:20px;}
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">🔄 闲置换钱</div>
        <nav class="nav">
            <a href="#" class="active" data-page="home">商品广场</a>
            <a href="#" data-page="publish">发布宝贝</a>
            <a href="#" data-page="orders">我的订单</a>
            <a href="#" data-page="wallet">资金钱包</a>
        </nav>
        <div class="balance-box">余额：<strong id="balance">0.00</strong> 元</div>
    </div>
</header>

<main class="container">
    <section id="home" class="page active">
        <div class="search-bar">
            <input type="text" class="search-input" id="search-input" placeholder="搜索你想要的宝贝...">
            <button class="btn btn-primary" id="search-btn">搜索</button>
            <button class="btn btn-success" id="quick-publish">+ 发布</button>
        </div>
        <div class="goods-grid" id="goods-grid"></div>
    </section>

    <section id="publish" class="page">
        <div class="form-card">
            <h2 class="form-title">📦 发布闲置商品</h2>
            <div class="form-group">
                <label class="form-label">商品名称 *</label>
                <input type="text" class="form-input" id="g-name" placeholder="如：iPhone 14 95新">
            </div>
            <div class="form-group">
                <label class="form-label">出售价格 *</label>
                <input type="number" class="form-input" id="g-price" placeholder="0.00" step="0.01">
            </div>
            <div class="form-group">
                <label class="form-label">商品分类</label>
                <select class="form-select" id="g-cate">
                    <option value="digital">数码电子</option>
                    <option value="clothes">服饰鞋包</option>
                    <option value="home">家居生活</option>
                    <option value="other">其他</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">图片链接</label>
                <input type="text" class="form-input" id="g-img" placeholder="https://i.imgur.com/xxxxxx.jpg">
            </div>
            <div class="form-group">
                <label class="form-label">详细描述</label>
                <textarea class="form-textarea" id="g-desc" placeholder="成色、购买时间、是否包邮..."></textarea>
            </div>
            <button class="btn btn-success btn-block" id="publish-btn">✅ 立即发布</button>
        </div>
    </section>

    <section id="orders" class="page">
        <h2 style="margin-bottom:20px;">我的订单</h2>
        <div id="order-list">
            <div class="empty"><p>暂无订单记录</p></div>
        </div>
    </section>

    <section id="wallet" class="page">
        <div class="wallet-card">
            <div>账户余额</div>
            <div class="wallet-amount">¥ <span id="w-balance">0.00</span></div>
            <div style="opacity:.8; font-size:13px;">安全 · 正规 · 可提现</div>
            <div class="wallet-btns">
                <button class="btn" id="recharge-btn">💰 充值</button>
                <button class="btn" id="withdraw-btn">💳 提现</button>
            </div>
        </div>
    </section>
</main>

<script>
let goodsList = [
    {
        id: 1,
        name: '雷速拉坦伊布拉莫维奇',
        price: 199,
        desc: 'v8体育官方特别提供，如想全免享用请联系客服',
        cate: 'digital',
        seller: '用户001',
        time: '10分钟前',
        img: 'https://i.imgur.com/tthwLa59.jpg'
    },
    {
        id: 2,
        name: '雷速傻哥专业连红搬运',
        price: 150,
        desc: 'v8体育官方特别提供，如想全免享用请联系客服',
        cate: 'digital',
        seller: '用户002',
        time: '30分钟前',
        img: 'https://i.imgur.com/RUneOSk.jpg'
    },
    {
        id: 3,
        name: '雷速弘扬奉献精神的阿火',
        price: 85,
        desc: 'v8体育官方特别提供，如想全免享用请联系客服',
        cate: 'digital',
        seller: '用户003',
        time: '1小时前',
        img: 'https://i.imgur.com/hhiXdqi.jpg'
    }
];
let balance = 2568.50;
let orders = [];

function switchPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    document.querySelector(`[data-page="${pageId}"]`).classList.add('active');
    if (pageId === 'home') renderGoods();
    if (pageId === 'wallet') document.getElementById('w-balance').textContent = balance.toFixed(2);
}

function renderGoods(list = goodsList) {
    const grid = document.getElementById('goods-grid');
    if (!list.length) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><p>没有找到相关宝贝</p></div>`;
        return;
    }
    grid.innerHTML = list.map(item => `
        <div class="goods-card">
            <div class="goods-img">
                ${item.img 
                    ? `<img src="${item.img}" alt="${item.name}">` 
                    : '📦'
                }
            </div>
            <div class="goods-body">
                <div class="goods-name">${item.name}</div>
                <div class="goods-desc">${item.desc}</div>
                <div class="goods-price">¥${item.price.toFixed(2)}</div>
                <div class="goods-meta"><span>${item.seller}</span><span>${item.time}</span></div>
                <button class="btn btn-primary btn-sm btn-block" style="margin-top:12px;" onclick="buyItem(${item.id})">立即购买</button>
            </div>
        </div>
    `).join('');
}

function buyItem(id) {
    const item = goodsList.find(g => g.id === id);
    if (!item) return;
    if (confirm(`确认购买【${item.name}】？\n价格：¥${item.price.toFixed(2)}\n余额：¥${balance.toFixed(2)}\n\n付款后资金由平台担保，确认收货后放款给卖家`)) {
        if (balance < item.price) { alert('余额不足，请先充值！'); switchPage('wallet'); return; }
        balance -= item.price;
        document.getElementById('balance').textContent = balance.toFixed(2);
        orders.unshift({ oid: Date.now(), name: item.name, price: item.price, status: 'pending', time: new Date().toLocaleString() });
        alert('下单成功！等待卖家发货 📦');
    }
}

function publishGoods() {
    const name = document.getElementById('g-name').value.trim();
    const price = parseFloat(document.getElementById('g-price').value);
    const desc = document.getElementById('g-desc').value.trim();
    const cate = document.getElementById('g-cate').value;
    const img = document.getElementById('g-img').value.trim();
    if (!name || !price || price <= 0) { alert('请填写完整的商品名称和价格！'); return; }
    goodsList.unshift({
        id: Date.now(), name, price, desc: desc || '暂无描述', cate,
        seller: '我', time: '刚刚', img: img || ''
    });
    alert('发布成功！🎉');
    document.getElementById('g-name').value = '';
    document.getElementById('g-price').value = '';
    document.getElementById('g-desc').value = '';
    document.getElementById('g-img').value = '';
    switchPage('home');
}

function searchGoods() {
    const kw = document.getElementById('search-input').value.trim().toLowerCase();
    if (!kw) return renderGoods();
    renderGoods(goodsList.filter(g => g.name.toLowerCase().includes(kw) || g.desc.toLowerCase().includes(kw)));
}

document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.nav a').forEach(a => {
        a.addEventListener('click', e => { e.preventDefault(); switchPage(a.getAttribute('data-page')); });
    });
    renderGoods();
    document.getElementById('balance').textContent = balance.toFixed(2);
    document.getElementById('publish-btn').addEventListener('click', publishGoods);
    document.getElementById('quick-publish').addEventListener('click', () => switchPage('publish'));
    document.getElementById('search-btn').addEventListener('click', searchGoods);
    document.getElementById('search-input').addEventListener('keydown', e => e.key === 'Enter' && searchGoods());
    document.getElementById('recharge-btn').addEventListener('click', () => {
        const num = parseFloat(prompt('请输入充值金额：'));
        if (num && num > 0) { balance += num; document.getElementById('balance').textContent = balance.toFixed(2); alert('充值成功！'); }
    });
    document.getElementById('withdraw-btn').addEventListener('click', () => {
        const num = parseFloat(prompt('请输入提现金额：'));
        if (num && num > 0 && num <= balance) { balance -= num; document.getElementById('balance').textContent = balance.toFixed(2); alert('提现申请提交！'); }
        else alert('金额无效或余额不足！');
    });
});
</script>

</body>
</html>
