<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8体育特供</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei", "PingFang SC", sans-serif;}
        :root {--primary:#2563eb; --success:#07c160; --warning:#f97316; --danger:#dc2626; --gray:#6b7280; --bg:#f8fafc;}
        body {background:var(--bg); min-height:100vh;}
        .header {background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.06); padding:0 20px; position:sticky; top:0; z-index:99;}
        .header-inner {max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; height:64px; flex-wrap:wrap; gap:10px;}
        .logo {font-size:20px; font-weight:700; color:var(--primary); display:flex; align-items:center; gap:8px;}
        .nav {display:flex; gap:8px; flex-wrap:wrap;}
        .nav a {text-decoration:none; color:#4b5563; padding:10px 18px; border-radius:8px; font-size:15px; transition:all .2s;}
        .nav a:hover, .nav a.active {background:var(--primary); color:#fff;}
        .balance-box {background:#fef3c7; color:#d97706; padding:8px 16px; border-radius:20px; font-size:14px; white-space:nowrap;}
        .balance-box strong {font-size:16px;}
        .kefu-header-link {background:var(--success); color:#fff; padding:8px 16px; border-radius:20px; font-size:14px; text-decoration:none; font-weight:600; white-space:nowrap; border:none; cursor:pointer;}
        .container {max-width:1200px; margin:0 auto; padding:24px 20px;}
        .page {display:none;}
        .page.active {display:block;}
        .search-bar {display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap;}
        .search-input {flex:1; min-width:250px; padding:14px 20px; border:1px solid #e5e7eb; border-radius:10px; font-size:15px;}
        .btn {padding:12px 24px; border:none; border-radius:10px; font-size:15px; cursor:pointer; white-space:nowrap;}
        .btn-primary {background:var(--primary); color:#fff;}
        .btn-success {background:var(--success); color:#fff;}
        .btn-sm {padding:8px 14px; font-size:14px;}
        .btn-block {width:100%;}
        .goods-grid {display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:20px;}
        .goods-card {background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.05); transition:all .3s;}
        .goods-card:hover {transform:translateY(-4px); box-shadow:0 8px 20px rgba(0,0,0,0.1);}
        .goods-img {width:100%; height:200px; background:linear-gradient(135deg,#e0e7ff,#c7d2fe); display:flex; align-items:center; justify-content:center; font-size:48px; color:var(--primary); overflow:hidden;}
        .goods-img img {width:100%; height:100%; object-fit:cover;}
        .goods-body {padding:16px;}
        .goods-name {font-size:16px; font-weight:600; margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
        .goods-desc {font-size:13px; color:var(--gray); margin-bottom:12px; min-height:40px; line-height:1.5;}
        .goods-price {font-size:22px; font-weight:700; color:var(--danger);}
        .goods-meta {display:flex; justify-content:space-between; margin-top:12px; font-size:12px; color:#9ca3af;}
        .empty {text-align:center; padding:60px 20px; color:#9ca3af; grid-column:1/-1;}
        /* 客服悬浮 */
        .kefu-float {position:fixed; bottom:30px; right:30px; z-index:999;}
        .kefu-float-btn {width:60px; height:60px; background:var(--success); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff; cursor:pointer; box-shadow:0 4px 15px rgba(7,193,96,.4); transition:all .3s;}
        .kefu-float-btn:hover {transform:scale(1.1);}
        .kefu-float-box {position:absolute; bottom:80px; right:0; width:320px; background:#fff; border-radius:12px; box-shadow:0 5px 30px rgba(0,0,0,.15); display:none; overflow:hidden;}
        .kefu-float-box.show {display:block;}
        .kefu-float-head {background:var(--success); color:#fff; padding:15px; font-weight:600;}
        .kefu-float-body {padding:20px; text-align:center;}
        .kefu-float-avatar {width:60px; height:60px; background:#e6f7ee; border-radius:50%; margin:0 auto 15px; display:flex; align-items:center; justify-content:center; font-size:30px;}
        .kefu-float-name {font-weight:600; margin-bottom:5px;}
        .kefu-float-desc {color:#6b7280; font-size:13px; margin-bottom:20px;}
        .kefu-float-link {display:block; background:var(--success); color:#fff; text-decoration:none; padding:12px; border-radius:8px; margin-bottom:10px; font-weight:600; border:none; cursor:pointer; font-size:16px;}
        .kefu-float-link.qq {background:#12b7f5;}
        @media (max-width:768px) {
            .header-inner {flex-direction:column; gap:12px; padding:12px 0; height:auto;}
            .goods-grid {grid-template-columns:repeat(2,1fr);}
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">📘 V8体育特供</div>
        <nav class="nav">
            <a href="#" class="active" data-page="home">商品广场</a>
            <a href="#" data-page="orders">我的订单</a>
            <a href="#" data-page="wallet">资金钱包</a>
        </nav>
        <div style="display:flex; gap:10px; align-items:center;">
            <div class="balance-box">余额：<strong id="balance">0.00</strong> 元</div>
            <button class="kefu-header-link" onclick="showKefu()">💬 客服</button>
        </div>
    </div>
</header>

<main class="container">
    <section id="home" class="page active">
        <div class="search-bar">
            <input type="text" class="search-input" id="search-input" placeholder="搜索你想要的宝贝...">
            <button class="btn btn-primary" id="search-btn">搜索</button>
            <button class="btn btn-success" id="quick-publish">+ 发布</button>
        </div>
        <div class="goods-grid" id="goods-grid"></div>
    </section>

    <section id="orders" class="page">
        <h2 style="margin-bottom:20px;">我的订单</h2>
        <div id="order-list"><div class="empty"><p>暂无订单记录</p></div></div>
    </section>

    <section id="wallet" class="page">
        <div style="background:linear-gradient(135deg,#2563eb,#4f46e5); color:#fff; border-radius:16px; padding:40px; text-align:center; max-width:500px; margin:0 auto;">
            <div style="font-size:18px;">账户余额</div>
            <div style="font-size:48px; font-weight:700; margin:15px 0;">¥ <span id="w-balance">0.00</span></div>
            <div style="opacity:.8; font-size:14px;">安全 · 正规 · 可提现</div>
            <div style="display:flex; gap:12px; margin-top:30px; flex-wrap:wrap; justify-content:center;">
                <button class="btn" style="background:rgba(255,255,255,.2); color:#fff;" id="recharge-btn">💰 充值</button>
                <button class="btn" style="background:rgba(255,255,255,.2); color:#fff;" id="withdraw-btn">💳 提现</button>
            </div>
        </div>
    </section>
</main>

<!-- 悬浮客服 -->
<div class="kefu-float">
    <div class="kefu-float-btn" onclick="document.querySelector('.kefu-float-box').classList.toggle('show')">💬</div>
    <div class="kefu-float-box">
        <div class="kefu-float-head">在线客服</div>
        <div class="kefu-float-body">
            <div class="kefu-float-avatar">👨‍💼</div>
            <div class="kefu-float-name">V8官方客服</div>
            <div class="kefu-float-desc">工作时间：09:00-24:00<br>竭诚为您服务</div>
            <button class="kefu-float-link" onclick="alert('请添加微信：\nAA9767A')">💚 微信联系</button>
            <button class="kefu-float-link qq" onclick="alert('请添加QQ：\n142749228')">🐧 QQ联系</button>
        </div>
    </div>
</div>

<script>
// 👇 在这里填写你的商品信息
let goodsList = [
    {
        id: 1,
        name: '雷速拉坦伊布拉莫维奇',
        price: 199,
        desc: 'v8体育官方特别提供，如想全免享用请联系客服',
        img: 'https://i.postimg.cc/tJWSmNyD/yi-bu.jpg'
    },
    {
        id: 2,
        name: '雷速傻哥专业连红搬运',
        price: 150,
        desc: 'v8体育官方特别提供，如想全免享用请联系客服',
        img: 'https://i.postimg.cc/xdXP433G/sha-ge.jpg'
    },
    {
        id: 3,
        name: '雷速弘扬奉献精神的阿火',
        price: 85,
        desc: 'v8体育官方特别提供，如想全免享用请联系客服',
        img: 'https://i.postimg.cc/qMpxTTG7/a-huo.jpg'
    }
];

let balance = 0.00;
let orders = [];

function showKefu() {
    alert('微信：AA9767A\nQQ群：142749228\n请添加好友联系客服');
}

function switchPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    document.querySelector(`[data-page="${pageId}"]`).classList.add('active');
    if (pageId === 'home') renderGoods();
    if (pageId === 'wallet') document.getElementById('w-balance').textContent = balance.toFixed(2);
}

function renderGoods(list = goodsList) {
    const grid = document.getElementById('goods-grid');
    if (!list.length) {
        grid.innerHTML = `<div class="empty"><p>暂无商品，点击右上角「+发布」添加</p></div>`;
        return;
    }
    grid.innerHTML = list.map(item => `
        <div class="goods-card">
            <div class="goods-img">
                ${item.img 
                    ? `<img src="${item.img}" alt="${item.name}" onerror="this.parentElement.innerHTML='📦'">` 
                    : '📦'
                }
            </div>
            <div class="goods-body">
                <div class="goods-name">${item.name}</div>
                <div class="goods-desc">${item.desc}</div>
                <div class="goods-price">¥${item.price.toFixed(2)}</div>
                <button class="btn btn-primary btn-sm btn-block" style="margin-top:12px;" onclick="buyItem(${item.id})">立即购买</button>
            </div>
        </div>
    `).join('');
}

function buyItem(id) {
    const item = goodsList.find(g => g.id === id);
    if (!item) return;
    if (confirm(`确认购买【${item.name}】？\n价格：¥${item.price.toFixed(2)}\n余额：¥${balance.toFixed(2)}`)) {
        if (balance < item.price) { alert('余额不足，请先充值！'); switchPage('wallet'); return; }
        balance -= item.price;
        document.getElementById('balance').textContent = balance.toFixed(2);
        orders.unshift({ name: item.name, price: item.price, time: new Date().toLocaleString() });
        alert('下单成功！');
    }
}

function searchGoods() {
    const kw = document.getElementById('search-input').value.trim().toLowerCase();
    if (!kw) return renderGoods();
    renderGoods(goodsList.filter(g => g.name.toLowerCase().includes(kw) || g.desc.toLowerCase().includes(kw)));
}

document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.nav a').forEach(a => {
        a.addEventListener('click', e => { e.preventDefault(); switchPage(a.getAttribute('data-page')); });
    });
    renderGoods();
    document.getElementById('balance').textContent = balance.toFixed(2);
    document.getElementById('search-btn').addEventListener('click', searchGoods);
    document.getElementById('search-input').addEventListener('keydown', e => e.key === 'Enter' && searchGoods());
    document.getElementById('recharge-btn').addEventListener('click', () => {
        const num = parseFloat(prompt('请输入充值金额：'));
        if (num && num > 0) { balance += num; document.getElementById('balance').textContent = balance.toFixed(2); alert('充值成功！'); }
    });
    document.getElementById('withdraw-btn').addEventListener('click', () => {
        const num = parseFloat(prompt('请输入提现金额：'));
        if (num && num > 0 && num <= balance) { balance -= num; document.getElementById('balance').textContent = balance.toFixed(2); alert('提现申请提交！'); }
        else alert('金额无效或余额不足！');
    });
    document.getElementById('quick-publish').addEventListener('click', () => {
        const name = prompt('商品名称：');
        const price = parseFloat(prompt('价格：'));
        if (!name || !price) return alert('填写不完整！');
        goodsList.unshift({
            id: Date.now(),
            name,
            price,
            desc: prompt('商品描述：') || 'v8体育官方特供',
            img: prompt('图片链接（右键复制imgur图片地址）：') || ''
        });
        alert('发布成功！🎉');
        renderGoods();
    });
});
</script>

</body>
</html>
